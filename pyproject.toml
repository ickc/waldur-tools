[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "waldur-tools"
version = "0.3.0"
description = "Snapshot, analyse and report on Waldur / Isambard portal data"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kolen Cheung" }]
license = { text = "BSD-3-Clause" }
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "waldur-api-client>=8.0.9",
    "polars>=1.0",
    "typer>=0.12",
    "rich>=13.0",
    "platformdirs>=4.0",
    # Only the figure builder and its offline bundle; `viz` inlines plotly.js
    # into the HTML so the report opens with no network and no server.
    "plotly>=5.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.6",
    "respx>=0.21",
]

[project.scripts]
waldur-tools = "waldur_tools.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/waldur_tools"]

# --------------------------------------------------------------------------
# pixi
#
# One environment, deliberately. This package exists for the people who
# maintain it, so splitting the test and lint dependencies into a separate
# feature only bought us typing `-e dev` on every single command.
# --------------------------------------------------------------------------

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-aarch64", "linux-64", "osx-arm64", "osx-64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.11,<3.14"
# Only to run web/tests/parity.test.mjs, which checks the browser extension's
# arithmetic against this package's. The extension itself has no build step and
# no node dependencies -- it is loaded from source.
nodejs = ">=20"

[tool.pixi.pypi-dependencies]
waldur-tools = { path = ".", editable = true }
pytest = ">=8.0"
pytest-cov = ">=5.0"
mypy = ">=1.10"
ruff = ">=0.6"
respx = ">=0.21"

# Runs on every `pixi run` and `pixi shell`, and is where the cache directory
# and the API URL come from -- so pixi on its own is enough to use this tool.
# direnv is optional. An activation script is a shell script, and Windows does
# not have the same shell, so there are two of them; they set the same
# variables, and the token is read out of .envrc.local by waldur_tools.config
# on the platform whose shell cannot source it.
[tool.pixi.target.unix.activation]
scripts = ["scripts/activate.sh"]

[tool.pixi.target.win-64.activation]
scripts = ["scripts/activate.bat"]

[tool.pixi.tasks]
cli = "waldur-tools"
test = "pytest"
lint = "ruff check src tests"
fmt = "ruff format src tests"
typecheck = "mypy src"

# The browser extension. `web-vendor` writes the plotly bundle it loads, out of
# the same `get_plotlyjs()` the command-line report inlines, so the two cannot
# end up on different plotly versions. `test-web` checks the extension's
# arithmetic against this package's, and must run after `test`, which is what
# regenerates the golden files it reads.
web-vendor = { cmd = "python scripts/vendor_plotly.py" }
test-web = { cmd = "node --test 'web/tests/*.test.mjs'", depends-on = ["test"] }
# Writes the release asset into dist/. The plotly bundle is generated and not
# committed, so packing depends on vendoring it -- an archive built without it
# would be an extension that cannot draw.
web-pack = { cmd = "python scripts/pack_web.py", depends-on = ["web-vendor"] }

check = { depends-on = ["lint", "typecheck", "test", "test-web"] }

# --------------------------------------------------------------------------
# tooling
# --------------------------------------------------------------------------

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.ruff.lint.isort]
# conftest is imported by name, since tests are not a package.
known-first-party = ["waldur_tools", "conftest"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
# Neither the generated Waldur client nor plotly ships type information.
[[tool.mypy.overrides]]
module = ["waldur_api_client.*", "plotly.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
