name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: dev
          cache: true

      - name: Lint
        run: pixi run -e dev lint

      - name: Format check
        run: pixi run -e dev ruff format --check src tests

      - name: Type check
        run: pixi run -e dev typecheck

      - name: Test
        run: pixi run -e dev pytest --cov=waldur_tools --cov-report=term-missing
