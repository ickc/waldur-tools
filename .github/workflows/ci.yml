name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # One environment holds everything, so there is nothing to select here.
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true

      - name: Lint
        run: pixi run lint

      - name: Format check
        run: pixi run ruff format --check src tests

      - name: Type check
        run: pixi run typecheck

      - name: Test
        run: pixi run pytest --cov=waldur_tools --cov-report=term-missing

      # Runs after the suite above, which is what regenerates the golden files
      # the parity test reads -- and which fails first if they were left
      # uncommitted. `pixi run test-web` would re-run pytest for that reason, so
      # the runner is invoked directly here.
      - name: Web tests
        run: pixi run node --test 'web/tests/*.test.mjs'
