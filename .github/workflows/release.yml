name: Release

# One tag releases the whole repository. This package and the browser extension
# are two shippable things kept deliberately at the same version number, so a
# single unprefixed `v*` tag names that one number rather than pretending the
# two ship on their own schedules. The extension's zip is the asset; the
# package is released by the tag itself.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Before anything slow. The version is written down in three places that
      # are meant to move together, and a tag that disagrees with any of them
      # would publish an asset whose name and whose contents report different
      # versions. Every mismatch is reported, not just the first, so one push
      # tells you everything left to fix.
      - name: The tag has to name the version everywhere it is written
        run: |
          tag=${GITHUB_REF_NAME#v}
          manifest=$(jq -r .version web/manifest.json)
          pyproject=$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          dunder=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/waldur_tools/__init__.py)
          status=0
          for pair in "web/manifest.json:$manifest" "pyproject.toml:$pyproject" "src/waldur_tools/__init__.py:$dunder"; do
            if [ "${pair#*:}" != "$tag" ]; then
              echo "::error::tag $GITHUB_REF_NAME says $tag, ${pair%%:*} says ${pair#*:}"
              status=1
            fi
          done
          exit $status

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true

      # A tag can be pushed at a commit that never went through CI, so the whole
      # suite runs again here rather than being assumed. `check` covers the
      # parity test, which is what pins the extension's arithmetic to this
      # package's -- the one thing that must not ship wrong.
      - name: Check
        run: pixi run check

      # Depends on `web-vendor`, so the plotly bundle is written before the
      # archive is. `pixi.lock` is committed, so it is the same bundle any
      # checkout vendors and the same one `waldur-tools viz` inlines.
      - name: Pack
        run: pixi run web-pack

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --verify-tag \
            --title "waldur-tools $GITHUB_REF_NAME" \
            --notes "$(cat .github/install-notes.md)" \
            --generate-notes
