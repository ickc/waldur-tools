repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Belt and braces: the token must never reach a commit.
  - repo: local
    hooks:
      - id: no-envrc-local
        name: refuse to commit .envrc.local
        entry: .envrc.local must never be committed
        language: fail
        files: ^\.envrc\.local$
